name: Android build verification

on:
  push:
    branches: [main]
    paths:
      - "anastasia-space.apk"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "android/**"
      - "www/**"
      - ".github/workflows/android-build.yml"

  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "android/**"
      - "www/**"
      - ".github/workflows/android-build.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk
